font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13

symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Create new tab while in current directory
map ctrl+shift+t new_tab_with_cwd

# Create new window while in current directory
map ctrl+shift+enter new_window_with_cwd 

# Navigation keys between windows
map alt+left neighboring_window left 
map alt+up neighboring_window up
map alt+right neighboring_window right
map alt+down neighboring_window down

# Navigation keys between windows - VIM MODE
map alt+h neighboring_window left 
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+j neighboring_window down

# Navigation keys between tabs - VIM MODE

map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab

# Navigate based on the index between tabs
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

# Interactive tab selection
map ctrl+shift+s select_tab

# Changing the tab bar limitations
tab_bar_min_tabs 1

hide_window_decorations yes

# Tab Customization
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index}:{title}"

tab_bar_edge top

enable_audio_bell no
bell_on_tab "🔔 "

# cursor_trail 200
# cursor_trail_decay 0.1 0.4
# cursor_trail_start_threshold 2

# Disable warning copy/paste
paste_actions filter


# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
