
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_status_background "#1E1E2E"
set -g @catppuccin_status_connect_separator "off"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "

set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "icon"

set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_number_color "#{E:@thm_blue}"
set -g @catppuccin_window_current_text "#[fg=#{@thm_blue},bg=#{@thm_surface_1}]#I#[fg=#{@thm_surface_1},bg=#{@thm_blue}] #[fg=#{@thm_mantle},bg=#{@thm_blue}]#{?#{!=:#{window_name},}, #W,}"

set -g @catppuccin_window_number ""
set -g @catppuccin_window_number_color "#{E:@thm_surface_0}"
set -g @catppuccin_window_text "#[fg=#{@thm_blue},bg=#{@thm_surface_0}] #I#{?#{!=:#{window_name},},  #W,}"

set -g status-justify "left"

# Load Catppuccin theme
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

#Load custom modules
source -F '#{d:current_file}/.tmux/custom_modules/ctp_memory.conf'
source -F '#{d:current_file}/.tmux/custom_modules/ctp_cpu.conf'
source -F '#{d:current_file}/.tmux/custom_modules/primary_ip.conf'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Change the keys for swap between windows
bind j previous-window
bind k next-window
unbind p
unbind n

# for creating the window
bind w new-window
unbind c

# Empty line after status if needed
set -g status on
set -Fg 'status-format[0]' '#{status-format[0]}'
set-window-option -g status-position top


# change window numbers to start with 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-environment -g COLORTERM "truecolor"

# Make sure that the automatic rename is ON
set-option -g allow-rename on
set-option -g automatic-rename on

# Make the status line pretty and add some modules
set -g status-right-length 150
set -g status-left-length 100
set -g status-left ""


set -g status-right "#{E:@catppuccin_status_application}"
set -gF status-right '#{E:@catppuccin_status_primary_ip}'
set -agF status-right '#{E:@catppuccin_status_ctp_memory}'
set -agF status-right '#{E:@catppuccin_status_ctp_cpu}'
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right '#{E:@catppuccin_status_date_time}'
set -ga status-right "#[bg=#{@thm_green}]#{?#{==:#{online_status},ok},#[fg=#{@thm_crust}] 󰖩 on ,#[fg=#{@thm_red}]#[bg=#{@thm_surface_0}] 󰖪 off }"

# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'dreknix/tmux-primary-ip'

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'

# Restoring pane contents
set -g @resurrect-capture-pane-contents 'on'

# Automatic Restore
set -g @continuum-restore 'on'

# Configure tmux-yank
set -g @yank_selection_mouse 'primary' # or 'clipboard' or 'secondary'

# Enable preview images for Yazi Plugin
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
